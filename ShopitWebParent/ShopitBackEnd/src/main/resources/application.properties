spring.application.name=ShopitBackEnd
server.port=8080
server.servlet.context-path=/ShopitAdmin

##Connection to Database

spring.datasource.url = jdbc:mysql://localhost:3306/Shopitdb
spring.datasource.username=root
spring.datasource.password=

## JPA /Hibernate Properties

## Tells Hibernate how to handle schema generation (tables, columns) at app startup.
spring.jpa.hibernate.ddl-auto=update

## Logs the SQL queries generated by Hibernate to the console.
spring.jpa.show-sql = true

##Formats/logs SQL in a more readable, indented way.
spring.jpa.properties.hibernate.format_sql = true

## Specifies the SQL dialect Hibernate should use — essentially, how to talk to your specific database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect


logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
